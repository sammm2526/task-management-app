<!-- Inherit header/footer structure from base.html -->
{% extends "base.html" %}

<!-- Set page title -->
{% block title %}TaskFlow - Register{% endblock %}

{% block content %}
<div class="form-container-wrapper">
    <!-- Main Form Card: Centered card layout -->
    <div class="form-card">
        <h2 class="form-title">Create Account</h2>
        <p class="form-subtitle">Join TaskFlow today and start organizing your tasks</p>
        
        <!-- Registration Form -->
        <form action="{{ url_for('register') }}" method="POST" class="form-group-wrapper">
            <!-- Full Name Input Field -->
            <div class="form-field">
                <label for="fullName" class="form-label">Full Name</label>
                <input 
                    type="text" 
                    id="fullName" 
                    name="fullName" 
                    placeholder="John Doe" 
                    required 
                    class="form-input"
                >
            </div>

            <!-- Username Input Field -->
            <div class="form-field">
                <label for="username" class="form-label">Username</label>
                <input 
                    type="text" 
                    id="username" 
                    name="username" 
                    placeholder="johndoe123" 
                    required 
                    class="form-input"
                >
            </div>
            
            <!-- Email Input Field -->
            <div class="form-field">
                <label for="email" class="form-label">Email Address</label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="name@example.com" 
                    required 
                    class="form-input"
                >
            </div>
            
            <!-- Password Input Field -->
            <div class="form-field">
                <label for="password" class="form-label">Password</label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Min. 8 characters" 
                    required 
                    class="form-input"
                >
            </div>

            <!-- Confirm Password Input Field -->
            <div class="form-field">
                <label for="confirmPassword" class="form-label">Confirm Password</label>
                <input 
                    type="password" 
                    id="confirmPassword" 
                    name="confirmPassword" 
                    placeholder="Repeat your password" 
                    required 
                    class="form-input"
                >
            </div>
            
            <!-- Register Button -->
            <button type="submit" class="btn btn-primary btn-block">Register</button>
        </form>
        
        <!-- Redirect link to login if user already has an account -->
        <div class="form-footer">
            <p>Already have an account? <a href="{{ url_for('login') }}" class="form-link">Login here</a></p>
        </div>
    </div>
</div>
{% endblock %}
